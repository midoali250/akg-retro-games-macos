name: Build macOS playable preview
on:
  push:
    branches: [main]
    paths: ['launcher.py', 'launch_game.py', 'libretro_host.py', 'game_session.py', 'scripts/**', '.github/workflows/playable-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned BitVault Engine registry
        run: python scripts/verify_engine.py
      - name: Build native libretro cores
        run: bash scripts/build_cores.sh osx
      - name: Download and verify user games
        run: python scripts/package_roms.py
      - name: Install dependencies
        run: python -m pip install pygame==2.6.1 pyinstaller==6.11.1 setuptools==70.3.0
      - name: Build application
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name AKG-Retro-Games --icon assets/platform-icons/retro-collection.icns --add-data 'assets:assets' --add-data 'drive-index.json:.' --add-data 'NOTICE.md:.' --add-data 'cheats:cheats' --add-data 'package-cores:cores' --add-data 'package-roms:roms' --add-data 'third-party-notices:third-party-notices' launcher.py
      - name: Smoke test packaged sessions
        run: |
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          export HOME="$(mktemp -d)"
          dist/AKG-Retro-Games.app/Contents/MacOS/AKG-Retro-Games --smoke
          dist/AKG-Retro-Games.app/Contents/MacOS/AKG-Retro-Games --smoke --ci-game-id 1TuDbnOzqjx3Z0WKKuc3zkRrLAR7F_pwf
          dist/AKG-Retro-Games.app/Contents/MacOS/AKG-Retro-Games --smoke --ci-game-id 1RW03OkSJ_ZC4fCc2fT84rtUGwqmng0dT
      - name: Zip preview
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/AKG-Retro-Games.app AKG-Retro-Games-macOS-preview.zip
          shasum -a 256 AKG-Retro-Games-macOS-preview.zip > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AKG-Retro-Games-macOS-playable-preview
          path: |
            AKG-Retro-Games-macOS-preview.zip
            SHA256.txt
          if-no-files-found: error
          retention-days: 14
