name: Build macOS menu-only preview
on:
  push:
    branches: [main]
    paths: ['launcher.py', 'library.py', 'assets/**', 'drive-index.json', 'NOTICE.md', '.github/workflows/package-menu.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pygame==2.6.1 pyinstaller==6.11.1
      - name: Build menu-only application
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name AKG-Retro-Games-Menu-Preview --icon assets/platform-icons/retro-collection.icns --add-data 'assets:assets' --add-data 'drive-index.json:.' --add-data 'NOTICE.md:.' launcher.py
      - name: Smoke test packaged menu
        run: |
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy dist/AKG-Retro-Games-Menu-Preview.app/Contents/MacOS/AKG-Retro-Games-Menu-Preview --smoke
      - name: Zip preview and checksum
        run: |
          printf 'MENU PREVIEW ONLY: Does not run games. Experimental unsigned and unnotarized test build.\n' > dist/READ-ME.txt
          cd dist
          ditto -c -k --sequesterRsrc --keepParent AKG-Retro-Games-Menu-Preview.app ../AKG-Retro-Games-macOS-menu-preview.zip
          cd ..
          shasum -a 256 AKG-Retro-Games-macOS-menu-preview.zip > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AKG-Retro-Games-macOS-menu-only-preview
          path: |
            AKG-Retro-Games-macOS-menu-preview.zip
            SHA256.txt
          retention-days: 14
          if-no-files-found: error
